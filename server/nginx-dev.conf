# Sandbox preview proxy: plain HTTP on :3000 in front of the relay.
# Mirrors the routes the production Caddyfile serves, without TLS/ACME:
#   /admin/monitor  -> relay WebSocket port (browser listening)
#   /admin*         -> relay dashboard HTTP server
#   everything else -> relay WebSocket port
# The only addition is a landing page for the published preview entry point.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3000;
    server_name _;

    # A WebSocket handshake on the entry point goes to the relay exactly as Caddy
    # routes it in production; a plain browser GET gets the preview landing page.
    # (Without this split, a redirect or static page at / would break WS clients.)
    location = / {
        if ($http_sec_websocket_key) {
            return 418;
        }
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }
    error_page 418 = @relay;

    location = /favicon.ico {
        return 204;
    }

    location = /admin/monitor {
        proxy_pass http://relay:443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /admin {
        proxy_pass http://relay:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location @relay {
        proxy_pass http://relay:443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://relay:443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
